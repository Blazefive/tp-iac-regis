repos:
  # ---- Hygiene generale --------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ---- Detection de secrets ---------------------------------------------
  # Hook local : on appelle le binaire gitleaks deja installe (version epinglee
  # localement) plutot que de rebuild l'action -> plus rapide et deterministe.
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (scan des secrets stagés)
        entry: gitleaks protect --staged --verbose
        language: system
        pass_filenames: false
