name: deploy

# Manual only. No push trigger, no pull_request trigger: on a public repository
# that is the smallest possible attack surface, and it keeps a human in front of
# every apply - the plan/apply control point the course insists on.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "deploy creates the instance and configures it, destroy removes it"
        required: true
        type: choice
        default: deploy
        options: [deploy, destroy]

permissions:
  contents: read

# Never cancel an apply in flight: a half-applied run leaves orphaned resources
# and a state file that no longer matches reality.
concurrency:
  group: deploy-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-3
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_vpc_id: ${{ vars.VPC_ID }}
  TF_VAR_ansible_control_public_key: ${{ vars.ANSIBLE_PUBLIC_KEY }}

jobs:
  deploy:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest

    # The environment is the human gate. Add a required reviewer to `aws-dev` in
    # the repository settings and no apply can start without an approval, even
    # from someone who can push to main.
    environment: aws-dev

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Configure AWS credentials
        # Long-lived access keys, and that is a compromise, not a choice: OIDC
        # needs an IAM role with a trust policy on token.actions.githubusercontent.com,
        # and this account grants no IAM permissions at all. Ask for a role and
        # delete these two secrets the day you get one.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: terraform init
        run: >-
          terraform -chdir=envs/dev-aws init -input=false
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}"

      # ---- destroy ---------------------------------------------------------

      - name: terraform destroy
        if: inputs.action == 'destroy'
        # Only the six resources in this root module. The VPC and the internet
        # gateway are data sources, so a destroy cannot touch them - they belong
        # to the shared account, not to us.
        run: terraform -chdir=envs/dev-aws destroy -auto-approve -input=false -no-color

      # ---- deploy ----------------------------------------------------------

      - name: terraform plan
        if: inputs.action == 'deploy'
        run: terraform -chdir=envs/dev-aws plan -out=dev.tfplan -input=false -no-color

      - name: terraform apply
        if: inputs.action == 'deploy'
        # Applies exactly the plan computed one step earlier, rather than
        # recomputing one that could differ.
        run: terraform -chdir=envs/dev-aws apply -no-color dev.tfplan

      - name: Collect outputs
        id: tf
        if: inputs.action == 'deploy'
        run: |
          cd envs/dev-aws
          echo "ip=$(terraform output -raw public_url | sed 's|http://||')" >>"$GITHUB_OUTPUT"
          echo "sg=$(terraform output -raw security_group_id)" >>"$GITHUB_OUTPUT"

      - name: Open SSH for this runner only
        id: jit
        if: inputs.action == 'deploy'
        # GitHub-hosted runners draw from huge dynamic ranges, so the security
        # group cannot allowlist them in advance and opening 22 to 0.0.0.0/0
        # would throw away the point of the exercise.
        #
        # Instead: authorise this one runner's address, for this one run, and
        # revoke it in a step that runs even on failure. The rule is deliberately
        # NOT managed by Terraform - it must not survive in the state.
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com)"
          echo "cidr=${runner_ip}/32" >>"$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ steps.tf.outputs.sg }}" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${runner_ip}/32,Description='github actions run ${{ github.run_id }}'}]" \
            >/dev/null
          echo "SSH opened for ${runner_ip}/32"

      - name: Install Ansible
        if: inputs.action == 'deploy'
        # ansible-core alone lacks community.mysql, which the GLPI playbook uses
        # to create the database and its user. A control node installed from apt
        # gets the whole bundle; a runner does not.
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Prepare the SSH key
        if: inputs.action == 'deploy'
        # ansible.cfg expects the key at this path. Written 0600 under a umask so
        # it is never briefly world-readable, and it dies with the runner.
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" >~/.ssh/id_ed25519
          # host_key_checking stays True in ansible.cfg, so the host key of a
          # brand new instance has to be learned before the first connection.
          for _ in $(seq 1 20); do
            ssh-keyscan -T 5 -H "${{ steps.tf.outputs.ip }}" 2>/dev/null >>~/.ssh/known_hosts && break
            sleep 6
          done

      - name: Wait for the instance to accept SSH
        if: inputs.action == 'deploy'
        # cloud-init installs nginx and appends the control node key through
        # user_data; until it has run there is nothing to connect to.
        run: |
          for i in $(seq 1 30); do
            if ssh -o BatchMode=yes -o ConnectTimeout=5 -i ~/.ssh/id_ed25519 \
                 ubuntu@"${{ steps.tf.outputs.ip }}" true 2>/dev/null; then
              echo "reachable after $((i * 10))s"; exit 0
            fi
            sleep 10
          done
          echo "instance never became reachable"; exit 1

      - name: Run the playbook
        if: inputs.action == 'deploy'
        run: |
          cd ansible
          # Inventory generated from the Terraform output: the address is not
          # known before the apply, so it cannot be committed.
          cat >ci-inventory.ini <<EOF
          [web]
          aws-web-01 ansible_host=${{ steps.tf.outputs.ip }}

          [web:vars]
          ansible_user=ubuntu
          EOF
          ansible-playbook -i ci-inventory.ini glpi.yml
          # A second pass must change nothing. If it does, the playbook describes
          # actions instead of a state, and the run should fail.
          ansible-playbook -i ci-inventory.ini glpi.yml | tee second.log
          grep -q "changed=0" second.log || { echo "playbook is not idempotent"; exit 1; }

      - name: Report
        if: inputs.action == 'deploy'
        run: |
          {
            echo "### Deployed"
            echo "- URL: http://${{ steps.tf.outputs.ip }}"
            echo "- Security group: \`${{ steps.tf.outputs.sg }}\`"
            echo ""
            echo "It is billing now. Re-run this workflow with \`destroy\` when finished."
          } >>"$GITHUB_STEP_SUMMARY"

      # ---- always ----------------------------------------------------------

      - name: Revoke the temporary SSH rule
        # `always()`: a failed apply or a failed playbook must not leave the port
        # open. Without this step the whole just-in-time approach is worse than
        # useless, because the rule would accumulate one entry per run.
        if: always() && steps.jit.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ steps.tf.outputs.sg }}" \
            --protocol tcp --port 22 --cidr "${{ steps.jit.outputs.cidr }}" \
            >/dev/null 2>&1 || echo "rule already gone (the group may have been destroyed)"
          echo "Revoked ${{ steps.jit.outputs.cidr }}"

      - name: Show remaining ingress rules
        if: always() && inputs.action == 'deploy' && steps.tf.outputs.sg != ''
        # Proof rather than assumption: what does the group actually allow now?
        run: |
          aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=${{ steps.tf.outputs.sg }}" \
            --query 'SecurityGroupRules[?!IsEgress].[FromPort,CidrIpv4,Description]' \
            --output table 2>/dev/null || echo "group no longer exists"
