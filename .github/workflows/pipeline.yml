name: pipeline

# TRIGGER (the assignment leaves the choice open):
#
#   workflow_dispatch  the full chain, manually. On a PUBLIC repository this is
#                      the smallest attack surface there is - no fork can start
#                      it - and it keeps a human in front of every apply, which
#                      is the plan/apply control point the course insists on.
#
#   pull_request       STEP 1 only. Validation runs on every proposed change,
#                      with no credentials and nothing deployed, so a fork can
#                      be linted safely.
#
# `pull_request`, never `pull_request_target`: the latter would run the fork's
# code in THIS repository's context, with the secrets. That is CICD-SEC-04 in
# the OWASP CI/CD Top 10 and it is how credentials get stolen.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ce que fait cette execution"
        type: choice
        default: deploy
        options:
          # Deploie et LAISSE l'instance en vie : le seul mode qui donne un lien
          # utilisable. Elle facture jusqu'a la destruction.
          - deploy
          # Deploie, verifie, puis detruit dans la foulee. Le lien affiche est
          # deja mort : mode controle, pas mode demonstration.
          - deploy-puis-detruire
          # Detruit une instance laissee en vie par une execution precedente.
          - detruire
      acces:
        description: "Qui peut atteindre l'application"
        type: choice
        default: prive
        options:
          # Le port applicatif n'accepte que l'adresse d'administration. Defaut
          # sur : ouvrir au monde doit s'ecrire, jamais s'obtenir par oubli.
          - prive
          # Le port applicatif est ouvert a 0.0.0.0/0. SSH reste restreint dans
          # les deux cas - c'est l'application qu'on partage, pas la machine.
          - public
  pull_request:
    paths: ["envs/**", "ansible/**", "Makefile", ".github/workflows/**"]

# Least privilege at the workflow level. Jobs cannot widen this.
permissions:
  contents: read

# Never cancel a run in flight: a half-applied pipeline leaves orphaned
# resources and a state file that no longer matches reality.
concurrency:
  group: pipeline-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-3
  # Terraform reads TF_VAR_* from the environment, so no .tfvars file is ever
  # written to the runner disk. The two key-related variables are NOT here: they
  # are derived from the private key secret in the "Prepare the SSH key" step,
  # so the key material has a single source.
  TF_VAR_admin_cidr: ${{ vars.ADMIN_CIDR }}
  TF_VAR_vpc_id: ${{ vars.VPC_ID }}
  # Vide en mode prive : la variable Terraform retombe alors sur son defaut
  # `null`, et coalesce() restreint le port applicatif a admin_cidr.
  TF_VAR_game_cidr: ${{ inputs.acces == 'public' && '0.0.0.0/0' || '' }}

jobs:
  # ===========================================================================
  # STEP 1 - Validation of the infrastructure code
  #
  # No AWS credentials in this job at all. It reads the repository, runs three
  # linters and stops. There is nothing here worth attacking, which is what
  # makes it safe to run on a fork's pull request.
  # ===========================================================================
  validate:
    name: "1. fmt / tflint / trivy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Actions are pinned by commit SHA, not by tag. A tag is a mutable
        # pointer: CVE-2025-30066 (tj-actions/changed-files) was exactly that -
        # version tags rewritten to a malicious commit, executed by every
        # workflow using @vX without a line of their own repo changing.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Setup trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: make fmt
        run: make fmt

      - name: make tflint
        run: make tflint

      - name: make trivy
        run: make trivy

  # ===========================================================================
  # STEPS 2, 3 and 4 - provision, inventory, configure
  #
  # `needs: validate` is the condition the assignment asks for: this job does
  # not start unless all three gates were green, so a red linter deploys
  # nothing.
  #
  # The guard is doubled on purpose. `make apply` also depends on `make verify`,
  # so the same rule holds when the target is run from a laptop, where no
  # GitHub job graph exists to enforce it. A safety property that only works
  # inside CI is not a property of the code.
  # ===========================================================================
  deploy:
    name: "2-4. EC2, inventory, Ansible"
    needs: validate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: aws-dev # a required reviewer here gates the apply
    outputs:
      ip: ${{ steps.inventory.outputs.ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Setup trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Install Ansible
        # ansible-core alone lacks the collections requirements.yml declares. A control
        # node installed from apt gets the bundle; a runner does not.
        run: |
          pip install --quiet ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Configure AWS credentials
        # Long-lived access keys, and that is a compromise rather than a choice:
        # OIDC needs an IAM role trusting token.actions.githubusercontent.com,
        # and this training account grants no IAM permissions at all. Ask for a
        # role and delete these two secrets the day you get one.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare the SSH key
        # Runs BEFORE Terraform, not after. aws_key_pair reads a public key FILE
        # at plan time, so the file must exist before the apply. Getting that
        # order wrong fails on a runner while working perfectly on a laptop that
        # happens to already have the key - a bug that only shows off the golden
        # path.
        #
        # The public half is DERIVED from the private one rather than stored as a
        # second secret: one source of truth, and no way for the two to drift.
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" >~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub
          {
            echo "TF_VAR_ssh_public_key_path=$HOME/.ssh/id_ed25519.pub"
            echo "TF_VAR_ansible_control_public_key=$(cat ~/.ssh/id_ed25519.pub)"
          } >>"$GITHUB_ENV"

      - name: Restore the backend configuration
        # backend.hcl carries the bucket name, hence the AWS account id, so it is
        # git-ignored and rebuilt here from a secret.
        run: printf 'bucket = "%s"\n' "${{ secrets.TF_STATE_BUCKET }}" >envs/dev-aws/backend.hcl

      - name: make init
        run: make init

      # ---- STEP 2 -------------------------------------------------------
      - name: make apply
        # Re-runs make verify as a prerequisite before touching AWS.
        if: inputs.action != 'detruire'
        run: make apply

      # ---- SSH access for this run only ---------------------------------
      - name: Open SSH for this runner only
        id: jit
        if: inputs.action != 'detruire'
        # Hosted runners draw from huge dynamic ranges, so the security group
        # cannot allowlist them in advance, and opening 22 to the world would
        # throw away the point of the exercise. Instead: authorise this one
        # address, for this one run, and revoke it in an always() step. The rule
        # is deliberately NOT managed by Terraform - it must not survive in the
        # state.
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com)"
          echo "cidr=${runner_ip}/32" >>"$GITHUB_OUTPUT"
          sg="$(terraform -chdir=envs/dev-aws output -raw security_group_id)"
          echo "sg=${sg}" >>"$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$sg" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${runner_ip}/32,Description='github run ${{ github.run_id }}'}]" \
            >/dev/null
          echo "SSH ouvert pour ${runner_ip}/32"

      # ---- STEP 3 -------------------------------------------------------
      - name: make inventory
        id: inventory
        if: inputs.action != 'detruire'
        run: |
          make inventory
          echo "ip=$(terraform -chdir=envs/dev-aws output -raw instance_public_ip)" >>"$GITHUB_OUTPUT"

      # ---- STEP 4 -------------------------------------------------------
      - name: make configure
        if: inputs.action != 'detruire'
        run: make configure

      - name: Lien et etat
        if: inputs.action != 'detruire'
        # Deux affichages, pas un. Le resume de job est riche mais il faut ouvrir
        # le run pour le voir ; une annotation ::notice:: apparait directement en
        # tete de la page du run et dans la liste des executions.
        run: |
          ip='${{ steps.inventory.outputs.ip }}'
          url="http://$ip:8080/"

          if [ '${{ inputs.acces }}' = 'public' ]; then
            acces='**public** — le lien est partageable'
          else
            acces='**prive** — joignable depuis la seule adresse d'"'"'administration. Relancer avec `acces: public` pour partager.'
          fi

          if [ '${{ inputs.action }}' = 'deploy' ]; then
            echo "::notice title=Application en ligne::$url (acces ${{ inputs.acces }})"
            etat='**en vie** — elle facture jusqu'"'"'a destruction'
            suite='Relancer ce workflow avec l'"'"'action **detruire** quand vous avez fini.'
          else
            echo "::notice title=Deploiement verifie puis detruit::$url (lien deja mort)"
            etat='**detruite** dans la foulee'
            suite='Pour un lien utilisable, relancer avec l'"'"'action **deploy**.'
          fi

          {
            echo "## Application deployee"
            echo ""
            echo "# $url"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Adresse IP | \`$ip\` |"
            echo "| Acces | $acces |"
            echo "| SSH | \`ssh ubuntu@$ip\` — depuis l'adresse d'administration |"
            echo "| Instance | $etat |"
            echo ""
            echo "$suite"
          } >>"$GITHUB_STEP_SUMMARY"

      # ---- Teardown -----------------------------------------------------
      - name: Revoke the temporary SSH rule
        # always(): a failed apply or a failed playbook must not leave the port
        # open. Without this the just-in-time approach would be worse than
        # useless, accumulating one rule per run.
        if: always() && steps.jit.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ steps.jit.outputs.sg }}" \
            --protocol tcp --port 22 --cidr "${{ steps.jit.outputs.cidr }}" >/dev/null 2>&1 \
            || echo "règle déjà absente"
          echo "révoqué ${{ steps.jit.outputs.cidr }}"

      - name: Destruction
        # always() pour que le mode "deploy-puis-detruire" nettoie meme si le
        # playbook a echoue : sinon un echec laisserait une instance a facturer,
        # ce qui est exactement le contraire du but.
        if: always() && inputs.action != 'deploy'
        run: |
          make destroy-auto
          echo "::notice title=Instance detruite::plus rien ne facture"
          {
            echo ""
            echo "### Destruction"
            echo "Instance detruite, rien ne facture."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remaining ingress rules
        if: always() && steps.jit.outputs.sg != ''
        # Proof rather than assumption: what does the group actually allow now?
        run: |
          aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=${{ steps.jit.outputs.sg }}" \
            --query 'SecurityGroupRules[?!IsEgress].[FromPort,CidrIpv4,Description]' \
            --output table 2>/dev/null || echo "groupe supprimé"
