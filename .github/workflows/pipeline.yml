name: pipeline

# workflow_dispatch runs the full chain: on a public repository it is the
# smallest attack surface, no fork can start it, and a human stays in front of
# every apply. pull_request runs STEP 1 only, with no credentials, so a fork can
# be linted safely.
#
# pull_request, never pull_request_target: the latter runs the fork's code in
# this repository's context, with the secrets (OWASP CI/CD Top 10, CICD-SEC-04).
on:
  workflow_dispatch:
    inputs:
      action:
        description: "Ce que fait cette execution"
        type: choice
        default: deploy
        options:
          - deploy # laisse l'instance en vie : le seul mode qui donne un lien utilisable
          - deploy-puis-detruire # deploie, verifie, detruit : mode controle
          - detruire # detruit une instance laissee par une execution precedente
      acces:
        description: "Qui peut atteindre l'application"
        type: choice
        default: prive
        options:
          - prive # port applicatif restreint a l'adresse d'administration
          - public # port applicatif ouvert a tous ; SSH reste restreint
  pull_request:
    paths: ["envs/**", "ansible/**", "Makefile", ".github/workflows/**"]

# Least privilege at the workflow level. Jobs cannot widen this.
permissions:
  contents: read

# Never cancel a run in flight: a half-applied pipeline leaves orphaned
# resources and a state file that no longer matches reality.
concurrency:
  group: pipeline-aws-dev
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: eu-west-3
  # Terraform reads TF_VAR_* from the environment, so no .tfvars file is ever
  # written to the runner disk. The key-related variables are absent here: they
  # are derived from the private key secret in "Prepare the SSH key".
  #
  # Secrets rather than repository variables: on a public repository the run
  # logs are public too, and GitHub masks only secrets. Masking is string
  # substitution, so the value is stored in the /32 form actually printed.
  TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
  TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
  # Empty in private mode: the Terraform variable falls back to null and
  # coalesce() restricts the port to admin_cidr.
  TF_VAR_game_cidr: ${{ inputs.acces == 'public' && '0.0.0.0/0' || '' }}

jobs:
  # ===========================================================================
  # STEP 1 - Validation of the infrastructure code
  #
  # No AWS credentials in this job at all: it reads the repository, runs three
  # linters and stops. Nothing here is worth attacking.
  # ===========================================================================
  validate:
    name: "1. fmt / tflint / trivy"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned by commit SHA, not by tag. A tag is a mutable pointer:
        # CVE-2025-30066 (tj-actions/changed-files) was version tags rewritten to
        # a malicious commit, executed by every workflow using @vX.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Setup trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: make fmt
        run: make fmt

      - name: make tflint
        env:
          # tflint --init downloads the AWS ruleset from the GitHub API. The
          # anonymous quota of 60 requests/hour is counted per IP address, and a
          # hosted runner shares its address: without a token the step fails on a
          # 403 with no Terraform code at fault.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make tflint

      - name: make trivy
        run: make trivy

  # ===========================================================================
  # STEPS 2, 3 and 4 - provision, inventory, configure
  #
  # needs: validate is the condition the assignment asks for. The guard is
  # doubled on purpose: make apply also depends on make verify, so the rule
  # holds from a laptop too. A safety property that only works inside CI is not
  # a property of the code.
  #
  # Destruction, however, is NOT gated on validation. needs: alone skips the
  # whole job when a gate is red, teardown included - a tflint broken by an API
  # rate limit once left a running instance with no way to remove it from the
  # pipeline. An escape hatch must never depend on what can break.
  #
  # !cancelled() is required: without an explicit status function GitHub adds an
  # implicit success() and skips the job anyway. The equality then carries the
  # gate for anything that creates, and make apply stays skipped in detruire
  # mode - nothing can be provisioned through this door.
  # ===========================================================================
  deploy:
    name: "2-4. EC2, inventory, Ansible"
    needs: validate
    if: >-
      !cancelled()
      && github.event_name == 'workflow_dispatch'
      && (needs.validate.result == 'success' || inputs.action == 'detruire')
    runs-on: ubuntu-latest
    # The environment carries a deployment branch policy limited to protected
    # branches, so only main can reach the AWS secrets. workflow_dispatch offers
    # a branch selector and accepts any ref, and a condition written here would
    # be no defence: it lives in the file, which the chosen branch can edit. The
    # policy lives on the repository instead, out of reach of the branch it
    # gates. This is also where a required reviewer would be added.
    environment: aws-dev
    outputs:
      ip: ${{ steps.inventory.outputs.ip }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        with:
          tflint_version: v0.64.0

      - name: Setup trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0

      - name: Install Ansible
        # ansible-core is enough: the playbook uses only ansible.builtin modules.
        run: pip install --quiet ansible-core

      - name: Configure AWS credentials
        # Long-lived access keys, a compromise rather than a choice: OIDC needs
        # an IAM role trusting token.actions.githubusercontent.com, and this
        # training account grants no IAM permissions at all.
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Prepare the SSH key
        # Before Terraform, not after: aws_key_pair reads a public key file at
        # plan time. The public half is derived from the private one rather than
        # stored as a second secret, so the two cannot drift.
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}" >~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >~/.ssh/id_ed25519.pub
          chmod 644 ~/.ssh/id_ed25519.pub
          {
            echo "TF_VAR_ssh_public_key_path=$HOME/.ssh/id_ed25519.pub"
            echo "TF_VAR_ansible_control_public_key=$(cat ~/.ssh/id_ed25519.pub)"
          } >>"$GITHUB_ENV"

      - name: Restore the backend configuration
        # backend.hcl carries the bucket name, hence the AWS account id, so it is
        # git-ignored and rebuilt here from a secret.
        run: printf 'bucket = "%s"\n' "${{ secrets.TF_STATE_BUCKET }}" >envs/dev-aws/backend.hcl

      - name: make init
        run: make init

      # ---- STEP 2 -------------------------------------------------------
      - name: make apply
        # Re-runs make verify before touching AWS, hence the same token need.
        if: inputs.action != 'detruire'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make apply

      - name: Open SSH for this runner only
        id: jit
        if: inputs.action != 'detruire'
        # Hosted runners draw from huge dynamic ranges, so they cannot be
        # allowlisted in advance, and opening 22 to the world would throw away
        # the point of the exercise. This rule is deliberately not managed by
        # Terraform: it must not survive in the state.
        run: |
          runner_ip="$(curl -fsS https://checkip.amazonaws.com)"
          echo "cidr=${runner_ip}/32" >>"$GITHUB_OUTPUT"
          sg="$(terraform -chdir=envs/dev-aws output -raw security_group_id)"
          echo "sg=${sg}" >>"$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress --group-id "$sg" \
            --ip-permissions "IpProtocol=tcp,FromPort=22,ToPort=22,IpRanges=[{CidrIp=${runner_ip}/32,Description='github run ${{ github.run_id }}'}]" \
            >/dev/null
          echo "SSH ouvert pour ${runner_ip}/32"

      # ---- STEP 3 -------------------------------------------------------
      - name: make inventory
        id: inventory
        if: inputs.action != 'detruire'
        run: |
          make inventory
          echo "ip=$(terraform -chdir=envs/dev-aws output -raw instance_public_ip)" >>"$GITHUB_OUTPUT"

      # ---- STEP 4 -------------------------------------------------------
      - name: make configure
        if: inputs.action != 'detruire'
        run: make configure

      - name: Lien et etat
        if: inputs.action != 'detruire'
        # Two displays: the job summary is richer but needs the run to be opened,
        # while a ::notice:: appears at the top of the run page and in the list.
        run: |
          ip='${{ steps.inventory.outputs.ip }}'
          url="http://$ip:8080/"

          if [ '${{ inputs.acces }}' = 'public' ]; then
            acces='**public** — le lien est partageable'
          else
            acces='**prive** — joignable depuis la seule adresse d'"'"'administration. Relancer avec `acces: public` pour partager.'
          fi

          if [ '${{ inputs.action }}' = 'deploy' ]; then
            echo "::notice title=Application en ligne::$url (acces ${{ inputs.acces }})"
            etat='**en vie** — elle facture jusqu'"'"'a destruction'
            suite='Relancer ce workflow avec l'"'"'action **detruire** quand vous avez fini.'
          else
            echo "::notice title=Deploiement verifie puis detruit::$url (lien deja mort)"
            etat='**detruite** dans la foulee'
            suite='Pour un lien utilisable, relancer avec l'"'"'action **deploy**.'
          fi

          {
            echo "## Application deployee"
            echo ""
            echo "# $url"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Adresse IP | \`$ip\` |"
            echo "| Acces | $acces |"
            echo "| SSH | \`ssh ubuntu@$ip\` — depuis l'adresse d'administration |"
            echo "| Instance | $etat |"
            echo ""
            echo "$suite"
          } >>"$GITHUB_STEP_SUMMARY"

      # ---- Teardown -----------------------------------------------------
      - name: Revoke the temporary SSH rule
        # always(): a failed apply or playbook must not leave the port open, or
        # the just-in-time approach accumulates one rule per run.
        if: always() && steps.jit.outputs.cidr != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-id "${{ steps.jit.outputs.sg }}" \
            --protocol tcp --port 22 --cidr "${{ steps.jit.outputs.cidr }}" >/dev/null 2>&1 \
            || echo "règle déjà absente"
          echo "révoqué ${{ steps.jit.outputs.cidr }}"

      - name: Destruction
        # always() so deploy-puis-detruire cleans up even when the playbook
        # failed: otherwise a failure leaves an instance billing.
        if: always() && inputs.action != 'deploy'
        run: |
          make destroy-auto
          echo "::notice title=Instance detruite::plus rien ne facture"
          {
            echo ""
            echo "### Destruction"
            echo "Instance detruite, rien ne facture."
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Remaining ingress rules
        if: always() && steps.jit.outputs.sg != ''
        # Proof rather than assumption: what does the group actually allow now?
        run: |
          aws ec2 describe-security-group-rules \
            --filters "Name=group-id,Values=${{ steps.jit.outputs.sg }}" \
            --query 'SecurityGroupRules[?!IsEgress].[FromPort,CidrIpv4,Description]' \
            --output table 2>/dev/null || echo "groupe supprimé"
