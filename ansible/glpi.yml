---
# Deploys a working GLPI: nginx + PHP-FPM + MariaDB, database initialised through
# the GLPI console so the run needs no web wizard and no human.
#
#   ansible-playbook glpi.yml -e target=control     # the local VM
#   ansible-playbook glpi.yml                       # group `web` (the EC2)
#   ansible-playbook glpi.yml --check --diff
#
# Needs the community.mysql collection:
#   ansible-galaxy collection install -r requirements.yml
#
# Run it twice: the second run must report changed=0.

- name: GLPI
  hosts: "{{ target | default('web') }}"
  become: true
  gather_facts: true

  vars:
    # Pinned, like the AMI. A moving version means the same playbook builds a
    # different system next month.
    glpi_version: "11.0.8"
    glpi_archive_url: "https://github.com/glpi-project/glpi/releases/download/{{ glpi_version }}/glpi-{{ glpi_version }}.tgz"

    glpi_root: /var/www/glpi
    glpi_db_name: glpi
    glpi_db_user: glpi
    # The password is generated ON THE TARGET and never leaves it: not in this
    # repository, not in the Terraform state, not in a CI log. See below.
    glpi_db_password_file: /root/.glpi_db_password

    glpi_packages:
      - nginx
      - mariadb-server
      - php-fpm
      - php-cli
      # Extensions required by composer.json for 11.0.8. The others it lists
      # (ctype, fileinfo, filter, hash, iconv, json, openssl, session,
      # tokenizer, zlib) are built into the Debian php-common package.
      - php-bcmath
      - php-curl
      - php-gd
      - php-intl
      - php-mbstring
      - php-mysql
      - php-xml
      # Not required but expected by GLPI's own health check.
      - php-zip
      - php-ldap
      - php-apcu
      # No php-opcache here: Debian and Ubuntu compile OPcache into the base PHP
      # package, so the name does not exist and asking for it fails the play.
      # community.mysql talks to MariaDB through this, not through the client.
      - python3-pymysql
      # Required to become an unprivileged user. Two tasks below run as www-data
      # rather than root, and Ansible then has to hand its temporary module file
      # to that account. Over SSH `pipelining = True` avoids the temp file
      # entirely, but this control node connects with ansible_connection=local
      # and the pipelining setting lives in [ssh_connection], so it does not
      # apply. Without acl the run fails on "Failed to set permissions on the
      # temporary files Ansible needs to create when becoming an unprivileged
      # user".
      - acl

  pre_tasks:
    - name: Refuse to run on a host that is not Debian family
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          Only Debian family hosts are handled. {{ inventory_hostname }} reports
          {{ ansible_facts['os_family'] }}.
        success_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      tags: [always]

  tasks:
    # ---- Packages --------------------------------------------------------

    - name: Install nginx, MariaDB, PHP and the extensions GLPI requires
      ansible.builtin.apt:
        name: "{{ glpi_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [packages]

    - name: Enable and start MariaDB
      ansible.builtin.systemd_service:
        name: mariadb
        state: started
        enabled: true
      tags: [service]

    - name: Find the PHP-FPM unit
      # php-fpm is a meta-package: the real unit carries the version
      # (php8.5-fpm.service on Ubuntu 26.04, php8.3-fpm on 24.04). Asking systemd
      # avoids hardcoding a PHP version that changes with the distribution.
      ansible.builtin.shell:
        cmd: set -o pipefail && systemctl list-unit-files 'php*-fpm.service' --no-legend | awk '{print $1}' | head -1
        executable: /bin/bash
      register: fpm_unit
      changed_when: false
      tags: [service]

    - name: Enable and start PHP-FPM
      ansible.builtin.systemd_service:
        name: "{{ fpm_unit.stdout | trim }}"
        state: started
        enabled: true
      tags: [service]

    # ---- Database --------------------------------------------------------

    - name: Load the timezone tables into MariaDB
      # Without them GLPI's own health check reports the timezone feature as
      # unavailable. The import is naturally idempotent, hence changed_when.
      ansible.builtin.shell:
        cmd: set -o pipefail && mariadb-tzinfo-to-sql /usr/share/zoneinfo | mariadb mysql
        executable: /bin/bash
      changed_when: false
      tags: [database]

    - name: Generate the database password, once, on the target
      # `creates` makes this run exactly once per host. The value is born on the
      # machine that needs it and stays there: nothing to commit, nothing to leak
      # through a CI log, nothing to rotate in two places.
      ansible.builtin.shell:
        cmd: "umask 077 && openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 32 > {{ glpi_db_password_file }}"
        creates: "{{ glpi_db_password_file }}"
      tags: [database]

    - name: Read the database password back
      ansible.builtin.slurp:
        src: "{{ glpi_db_password_file }}"
      register: db_password_raw
      no_log: true
      tags: [database]

    - name: Keep it out of the logs
      ansible.builtin.set_fact:
        glpi_db_password: "{{ db_password_raw.content | b64decode | trim }}"
      no_log: true
      tags: [database]

    - name: Create the GLPI database
      community.mysql.mysql_db:
        name: "{{ glpi_db_name }}"
        encoding: utf8mb4
        collation: utf8mb4_unicode_ci
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      tags: [database]

    - name: Create the GLPI database user
      community.mysql.mysql_user:
        name: "{{ glpi_db_user }}"
        password: "{{ glpi_db_password }}"
        # Scoped to the one database, and to localhost only. GLPI never needs
        # anything outside its own schema.
        priv: "{{ glpi_db_name }}.*:ALL"
        host: localhost
        state: present
        login_unix_socket: /run/mysqld/mysqld.sock
      no_log: true
      tags: [database]

    # ---- Application -----------------------------------------------------

    - name: Create the application directory
      ansible.builtin.file:
        path: "{{ glpi_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [app]

    - name: Download and unpack GLPI {{ glpi_version }}
      # The release tarball ships vendor/, so there is no composer step. `creates`
      # keeps this from re-downloading 91 MB on every run.
      ansible.builtin.unarchive:
        src: "{{ glpi_archive_url }}"
        dest: "{{ glpi_root }}"
        remote_src: true
        # The archive contains a top-level glpi/ directory.
        extra_opts: ["--strip-components=1"]
        creates: "{{ glpi_root }}/bin/console"
      tags: [app]

    - name: Hand the writable directories to the web user
      # Only these three need to be writable. The rest of the tree stays owned by
      # root, so a compromised PHP process cannot rewrite the application code.
      ansible.builtin.file:
        path: "{{ glpi_root }}/{{ item }}"
        state: directory
        owner: www-data
        group: www-data
        recurse: true
      loop: [files, config, marketplace]
      tags: [app]

    # ---- Web server ------------------------------------------------------

    - name: Locate the PHP-FPM socket
      ansible.builtin.find:
        paths: /run/php
        patterns: "php*-fpm.sock"
        file_type: any
      register: fpm_socket
      changed_when: false
      tags: [web]

    - name: Fail clearly if PHP-FPM exposes no socket
      ansible.builtin.assert:
        that: fpm_socket.matched > 0
        fail_msg: "No php*-fpm.sock under /run/php: PHP-FPM is installed but not running."
      tags: [web]

    - name: Configure the nginx site
      # root points at public/, not at the application directory. GLPI ships that
      # directory precisely so nothing else is reachable over HTTP: config,
      # files, src and vendor stay outside the served tree even if a rewrite rule
      # is wrong.
      ansible.builtin.copy:
        dest: /etc/nginx/sites-available/glpi.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible. Local edits will be overwritten.
          server {
              listen 80 default_server;
              listen [::]:80 default_server;
              server_name _;

              root {{ glpi_root }}/public;
              index index.php;

              # No version number in the Server header.
              server_tokens off;

              client_max_body_size 64M;

              location / {
                  try_files $uri /index.php$is_args$args;
              }

              location ~ ^/index\.php$ {
                  fastcgi_pass unix:{{ fpm_socket.files[0].path }};
                  fastcgi_split_path_info ^(.+\.php)(/.*)$;
                  include fastcgi_params;
                  fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
                  fastcgi_param PATH_INFO $fastcgi_path_info;
              }

              # Anything else ending in .php is not an entry point. Refusing it
              # closes the classic "upload a .php into a writable directory and
              # call it" path.
              location ~ \.php$ {
                  return 404;
              }
          }
      notify: Reload nginx
      tags: [web]

    - name: Enable the GLPI site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/glpi.conf
        dest: /etc/nginx/sites-enabled/glpi.conf
        state: link
      notify: Reload nginx
      tags: [web]

    - name: Disable the default nginx site
      # It also listens with default_server on port 80 and nginx refuses to start
      # with two of them.
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload nginx
      tags: [web]

    - name: Check that nginx accepts its configuration
      ansible.builtin.command: nginx -t
      changed_when: false
      check_mode: false
      tags: [web]

    - name: Apply the web server configuration before installing GLPI
      # The install step below talks to GLPI over HTTP, so the vhost has to be
      # live first. Handlers would otherwise only fire at the end of the play.
      ansible.builtin.meta: flush_handlers
      tags: [web]

    # ---- Install ---------------------------------------------------------

    - name: Initialise the GLPI database
      # The console installer replaces the web wizard entirely, which is what
      # makes this playbook unattended. Guarded on config_db.php: running it
      # again would wipe the instance.
      #
      # Run as www-data, NOT as root. GLPI refuses root outright and explains
      # why: everything the installer writes -- config_db.php, the caches, the
      # session directory -- would end up owned by root and unwritable by the web
      # server. There is an --allow-superuser escape hatch; using it here would
      # be fixing the message rather than the problem.
      become_user: www-data
      ansible.builtin.command:
        cmd: >-
          php bin/console database:install
          --db-host=localhost
          --db-name={{ glpi_db_name }}
          --db-user={{ glpi_db_user }}
          --db-password={{ glpi_db_password }}
          --default-language=fr_FR
          --no-interaction
        chdir: "{{ glpi_root }}"
        creates: "{{ glpi_root }}/config/config_db.php"
      # no_log because the command line carries the database password. The cost
      # is that a failure is censored too, so debugging means replaying the
      # command by hand on the target.
      no_log: true
      tags: [install]

    - name: Enable timezone support in GLPI
      # The timezone tables were loaded into MariaDB earlier, but GLPI still has
      # to be told to use them, otherwise its own health check keeps reporting
      # the feature as unavailable.
      become_user: www-data
      ansible.builtin.command:
        cmd: php bin/console database:enable_timezones --no-interaction
        chdir: "{{ glpi_root }}"
      # Converges to a state rather than performing an action, so it must not
      # report a change on every run.
      changed_when: false
      tags: [install]

    - name: Remove the web installer
      # Once the database is initialised this directory is only a way back in.
      ansible.builtin.file:
        path: "{{ glpi_root }}/install/install.php"
        state: absent
      tags: [install]

    - name: Schedule the GLPI cron
      # GLPI runs its queued work from cron. Without it notifications, inventory
      # and purges silently never happen.
      ansible.builtin.cron:
        name: glpi
        user: www-data
        minute: "*"
        job: "php {{ glpi_root }}/front/cron.php >/dev/null 2>&1"
      tags: [install]

  post_tasks:
    - name: Check that GLPI answers over HTTP
      ansible.builtin.uri:
        url: "http://127.0.0.1/"
        return_content: true
        status_code: 200
      register: glpi_page
      changed_when: false
      check_mode: false
      tags: [verify]

    - name: Check that the page really is GLPI and not an nginx default
      ansible.builtin.assert:
        that:
          - "'GLPI' in glpi_page.content"
        fail_msg: "Port 80 answers 200 but the body is not GLPI."
        success_msg: "GLPI {{ glpi_version }} is serving on {{ inventory_hostname }}."
      tags: [verify]

    - name: Check that the installer is no longer reachable
      ansible.builtin.uri:
        url: "http://127.0.0.1/install/install.php"
        status_code: [403, 404]
      changed_when: false
      check_mode: false
      tags: [verify]

  handlers:
    - name: Reload nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: reloaded
