---
# Installs nginx on the target hosts and deploys the static site into the nginx
# document root of each REMOTE machine.
#
#   ansible-playbook web.yml                        # -> group `web`
#   ansible-playbook web.yml -e target=control      # -> the control node itself
#   ansible-playbook web.yml -e target=all --check --diff
#   ansible-playbook web.yml --limit web-01
#
# Prerequisites on every remote target, done once:
#   ssh-copy-id -i ~/.ssh/id_ed25519.pub blaze@<address>
#   ssh-keyscan -H <address> >> ~/.ssh/known_hosts     # host_key_checking is on
#
# Run it twice: the second run must report changed=0.

- name: Static site on nginx
  # Parameterised rather than hardcoded, so the same playbook serves the remote
  # fleet and the control node without being duplicated.
  hosts: "{{ target | default('web') }}"
  become: true
  gather_facts: true

  vars:
    # Everything under this directory is deployed. Adding a fourth file needs no
    # change to this playbook.
    site_source: files/site

    # Debian and Ubuntu nginx serve from here. Override per host or per group in
    # host_vars/group_vars if a target differs.
    web_root: /var/www/html

    # Single source of truth, derived from the directory itself. fileglob is a
    # lookup, so it is evaluated on the CONTROL node -- which is exactly where
    # the files live.
    site_assets: "{{ query('ansible.builtin.fileglob', site_source + '/*') | map('basename') | sort }}"

  pre_tasks:
    - name: Refuse to run on a host that is not Debian family
      # The apt task and the /var/www/html default below only hold for Debian
      # family. Fail on the first task rather than half way through.
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'
        fail_msg: >-
          Only Debian family hosts are handled. {{ inventory_hostname }} reports
          {{ ansible_facts['os_family'] }}.
        success_msg: >-
          {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}
      tags: [always]

    - name: Report what is about to be deployed
      ansible.builtin.debug:
        msg: "{{ site_assets | length }} file(s) -> {{ inventory_hostname }}:{{ web_root }} : {{ site_assets | join(', ') }}"
      tags: [always]

  tasks:
    - name: Install nginx
      ansible.builtin.apt:
        name: nginx
        state: present
        update_cache: true
        cache_valid_time: 3600
      tags: [packages]

    - name: Enable and start nginx
      ansible.builtin.systemd_service:
        name: nginx
        state: started
        enabled: true
      tags: [service]

    - name: Ensure the document root exists
      ansible.builtin.file:
        path: "{{ web_root }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      tags: [content]

    - name: Deploy the site into the remote document root
      # A trailing slash on src copies the CONTENTS of the directory rather than
      # the directory itself.
      #
      # No handler here on purpose: nginx reads static files from disk on every
      # request, so reloading it after a content change achieves nothing. A
      # reload is only needed when the CONFIGURATION changes.
      ansible.builtin.copy:
        src: "{{ site_source }}/"
        dest: "{{ web_root }}/"
        owner: root
        group: root
        mode: "0644"
      tags: [content]

    - name: Remove the Debian placeholder page
      # It keeps answering on /index.nginx-debian.html and advertises the server
      # software for no reason.
      ansible.builtin.file:
        path: "{{ web_root }}/index.nginx-debian.html"
        state: absent
      tags: [content]

    # Note for later, deliberately not done here: nginx still answers
    # "Server: nginx/1.24.0 (Ubuntu)". `server_tokens off;` in a conf.d fragment
    # removes the version. Out of scope for a static site deployment.

  post_tasks:
    - name: Check that nginx serves each file, from the target itself
      # The uri module runs ON the target, so this proves nginx serves the file
      # rather than merely that the file exists on disk.
      ansible.builtin.uri:
        url: "http://127.0.0.1/{{ item }}"
        method: HEAD
        status_code: 200
      loop: "{{ site_assets }}"
      changed_when: false
      check_mode: false
      register: served_locally
      tags: [verify]

    - name: Check that the site is reachable across the network
      # Delegated to the control node and aimed at the target address: this is
      # the check that catches a listening-on-localhost-only nginx, or a firewall
      # in the way. become is off because no escalation is needed to fetch a URL.
      ansible.builtin.uri:
        url: "http://{{ ansible_host | default(inventory_hostname) }}/"
        method: HEAD
        status_code: 200
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      register: served_remotely
      tags: [verify]

    - name: Report what nginx answered
      ansible.builtin.debug:
        msg:
          - "local  : {{ served_locally.results | map(attribute='item') | zip(served_locally.results | map(attribute='status')) | map('join', ' -> HTTP ') | list }}"
          - "network: http://{{ ansible_host | default(inventory_hostname) }}/ -> HTTP {{ served_remotely.status }}"
      tags: [verify]
