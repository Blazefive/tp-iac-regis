# Ansible reads exactly ONE configuration file and stops at the first hit:
# $ANSIBLE_CONFIG, ./ansible.cfg, ~/.ansible.cfg, /etc/ansible/ansible.cfg.
# Settings are never merged, so a forgotten ~/.ansible.cfg silently wins. Check
# with: ansible --version | grep "config file"

[defaults]
inventory  = ./inventory.generated.ini
roles_path = ./roles

# The inventory sets ansible_user per group; make configure passes the key with
# --private-key. These are the fallbacks.
remote_user      = ubuntu
private_key_file = ~/.ssh/id_ed25519

# Never disable. Setting it False to silence the host authenticity prompt turns
# every run into an accepted man-in-the-middle. Populate known_hosts instead,
# which is what make inventory does with ssh-keyscan.
host_key_checking = True

interpreter_python = auto_silent

# Native YAML rendering since ansible-core 2.13. profile_tasks tells you which
# task is slow rather than leaving you to guess.
result_format     = yaml
callbacks_enabled = profile_tasks, timer

forks   = 10
timeout = 30

display_skipped_hosts = False
retry_files_enabled   = False

# log_path is deliberately unset: a run log records task arguments, so it
# captures anything not marked no_log. Enable it per run instead:
#   ANSIBLE_LOG_PATH=/tmp/run.log ansible-playbook yoxii.yml

[privilege_escalation]
# Off by default, requested per play or task with become: true. A control node
# that escalates everywhere turns every mistake into a root mistake.
become        = False
become_method = sudo
become_user   = root

# Passwordless sudo scoped to what the Ansible user needs is cleaner than
# storing a password, and keeps runs non-interactive.
become_ask_pass = False

[ssh_connection]
# One SSH session per host instead of one per task. Requires requiretty to be
# absent from sudoers, the default on Debian/Ubuntu.
pipelining = True

# Multiplexing. A literal % must be doubled in a .cfg file.
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[inventory]
# Fail loudly on a malformed inventory instead of running against an empty host
# list.
unparsed_is_failed = True
enable_plugins     = ini, yaml, auto
