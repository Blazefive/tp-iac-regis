# Ansible control node configuration.
#
# Ansible reads exactly ONE configuration file. It looks in this order and stops
# at the first hit -- settings are NEVER merged across files:
#
#   1. $ANSIBLE_CONFIG
#   2. ./ansible.cfg        <- this file, when run from this directory
#   3. ~/.ansible.cfg
#   4. /etc/ansible/ansible.cfg
#
# Consequence worth knowing: a forgotten ~/.ansible.cfg silently overrides
# /etc/ansible/ansible.cfg entirely. Always check which file is really in use:
#
#   ansible --version | grep "config file"

[defaults]
inventory  = ./inventory.generated.ini
roles_path = ./roles

# Managed nodes are reached as this user, with this key. The control node itself
# is declared with ansible_connection=local in the inventory, so it needs neither.
remote_user             = blaze
private_key_file        = ~/.ssh/id_ed25519

# Never disable this. Countless tutorials set it to False to silence the
# "authenticity of host cannot be established" prompt: that turns every run into
# an accepted man-in-the-middle. Populate known_hosts instead (ssh-keyscan).
host_key_checking = True

# Pick the remote interpreter automatically, without a warning on every task.
interpreter_python = auto_silent

# Readability and timing. profile_tasks is what tells you which task is slow,
# rather than guessing.
#
# NOT `stdout_callback = yaml`: that was community.general.yaml, removed in
# community.general 12.0.0. Since ansible-core 2.13 the native callback renders
# YAML itself through result_format, so there is nothing extra to enable.
result_format     = yaml
callbacks_enabled = profile_tasks, timer

forks   = 10
timeout = 30

# Noise reduction: skipped hosts and .retry files add nothing.
display_skipped_hosts = False
retry_files_enabled   = False

# Deliberately NOT enabled -- log_path = ./ansible.log
# A run log records task arguments, so it captures anything that is not marked
# no_log: tokens, passwords, connection strings. Enabling it writes secrets to
# a plain file that is easy to commit by accident. Turn it on per run instead:
#   ANSIBLE_LOG_PATH=/tmp/run.log ansible-playbook site.yml
# and treat that file like the secret it contains.

# Vault password read from a file rather than typed, once you have secrets:
# vault_password_file = ~/.ansible-vault-pass    (chmod 600, never in Git)

[privilege_escalation]
# Escalation stays OFF by default and is requested per play or per task with
# `become: true`. A control node that escalates everywhere by default turns
# every mistake into a root mistake.
become        = False
become_method = sudo
become_user   = root

# NOT set here on purpose: become_exe.
#
# Ubuntu 25.10 and later ship sudo-rs as /usr/bin/sudo. It accepts -p but does
# not emit the custom prompt Ansible waits for, so every escalation fails with
# "Timed out waiting for become success or become password prompt" while the
# password itself is perfectly valid. The fix is to point at the classic binary,
# still installed alongside it as /usr/bin/sudo.ws.
#
# That path is a property of ONE host, not of this project: an Ubuntu 24.04
# target has classic sudo at /usr/bin/sudo and no /usr/bin/sudo.ws at all, so
# setting it globally would break the fleet. It lives in inventory.ini as
# ansible_become_exe on the host that needs it.

# Set to True only if the managed nodes require a sudo password. Passwordless
# sudo for the Ansible user, scoped to what it actually needs, is the cleaner
# answer -- it keeps runs non-interactive without storing a password.
become_ask_pass = False

[ssh_connection]
# One SSH session per host instead of one per task: large speed win. Requires
# `requiretty` to be absent from sudoers, which is the default on Debian/Ubuntu.
pipelining = True

# Connection multiplexing. In an .cfg file a literal % must be doubled.
ssh_args     = -o ControlMaster=auto -o ControlPersist=60s
control_path = /tmp/ansible-ssh-%%h-%%p-%%r

[inventory]
# Fail loudly on a malformed inventory instead of silently ignoring the file and
# running against an empty host list.
unparsed_is_failed = True
enable_plugins     = ini, yaml, auto
