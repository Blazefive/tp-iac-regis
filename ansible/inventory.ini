# Static inventory, INI format.
#
# Check what Ansible actually reads from this file, rather than assuming:
#   ansible-inventory --graph
#   ansible-inventory --host ubuntu-iac
#
# `ansible_host` is the address used to connect; the name on the left is only an
# inventory label. The two are independent on purpose -- inventory_hostname is
# the label, never the DNS name.

# The control node manages itself through the local connection: no SSH loopback,
# no host key to accept, no key to authorise. This also makes
# `ansible all -m ping` a real end-to-end test of the setup.
#
# ansible_become_exe is a HOST variable, not a project setting: Ubuntu 26.04
# ships sudo-rs as /usr/bin/sudo, and sudo-rs does not emit the custom prompt
# Ansible waits for, so every escalation times out with a valid password. The
# classic binary is still installed alongside it. This host needs the
# workaround; the EC2 instance below runs 24.04 with classic sudo and would
# break if the path were set globally.
[control]
ubuntu-iac ansible_connection=local ansible_become_exe=/usr/bin/sudo.ws

# Managed nodes. The control node public key must be in each target's
# authorized_keys, and the host key must be known (host_key_checking is on):
#   ssh-copy-id -i ~/.ssh/id_ed25519.pub <user>@<address>
#   ssh-keyscan -H <address> >> ~/.ssh/known_hosts
#
# aws-web-01 is the EC2 instance created by envs/dev-aws. Terraform put the
# control node key in place through user_data, so no ssh-copy-id was needed.
[web]
# aws-web-01 ansible_host=<ip>   # rempli par le workflow, ou a la main apres un apply local

[db]
# db-01 ansible_host=172.31.50.20

# A group of groups: targets every managed node without touching the control one.
# Useful because `all` includes the control node, which you rarely want to patch
# in the same run as the fleet.
[lab:children]
web
db

# Amazon's Ubuntu images ship a passwordless-sudo `ubuntu` account and no other
# login. A group var beats an `all` var, which is precisely the precedence rule
# that makes this work without touching the block below.
[web:vars]
ansible_user=ubuntu

[all:vars]
ansible_user=blaze
ansible_ssh_private_key_file=~/.ssh/id_ed25519

# Reminder on precedence, since it is the usual source of surprise: host_vars
# beats group_vars, the more specific group beats the less specific one, and
# `all` is the weakest of all. Anything set here is therefore the easiest thing
# in the whole project to override by accident.
